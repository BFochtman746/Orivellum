name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Lint + tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install system deps (ffmpeg for audio tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # ── Gate 1: formatter + widened lint (frozen baseline in ruff.toml) ──
      - name: Ruff format
        run: uvx ruff format --check src tests scripts orivellum-runner

      - name: Ruff lint (full ruleset; baseline may only shrink)
        run: uvx ruff check src tests scripts orivellum-runner

      - name: Lint-debt ratchet (grandfathered files cannot gain violations)
        run: uv run --with ruff python scripts/check_lint_ratchet.py

      # ── Gate 3: architecture contracts + file-size budget ──
      - name: Architecture contracts (import-linter)
        run: uv run --with import-linter lint-imports

      - name: File-size budget
        run: python scripts/check_file_budget.py

      # ── Gate 4: decision records well-formed ──
      - name: ADR check
        run: python scripts/check_adrs.py

      # ── Gate 5: OpenAPI spec must match the live app ──
      - name: OpenAPI drift check
        env:
          SESSION_SECRET: ci-test-secret-not-a-real-key-padding-to-32-plus-chars
        run: uv run --with pyyaml python scripts/check_openapi_drift.py

      # ── Gate 5b: capability manifest — nothing ships unwired ──
      - name: Capability manifest gate
        env:
          SESSION_SECRET: ci-test-secret-not-a-real-key-padding-to-32-plus-chars
        run: uv run --with pyyaml python scripts/check_capability_manifest.py

      # ── Gate 6 runs inside the test suite (tests/test_property_based.py) ──
      - name: Tests with coverage gate
        env:
          SESSION_SECRET: ci-test-secret-not-a-real-key-padding-to-32-plus-chars
        # --cov-fail-under is a ratchet: it must never be lowered, only raised.
        # Baseline measured 2026-08-10: 55% line coverage (gate set 1pt below
        # to absorb run-to-run variance). See CONTRIBUTING.md.
        run: >
          uv run --with pytest --with pytest-cov --with hypothesis
          python -m pytest tests/ -q
          -p no:cacheprovider
          --cov=src/orivellum --cov-report=term
          --cov-fail-under=54

      - name: Orivellum Runner tests (xlsx prove pipeline)
        working-directory: orivellum-runner
        run: >
          uv run --with pytest --with openpyxl --with 'formulas==1.3.4'
          --with httpx python -m pytest tests/ -q -p no:cacheprovider

  epub-a11y:
    name: EPUB validation (EPUBCheck + Ace)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download EPUBCheck
        run: |
          curl -sL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.1.0/epubcheck-5.1.0.zip
          unzip -q epubcheck.zip

      # ── B15 gate: the builder's output must pass BOTH tools ──
      - name: Build + validate sample EPUB
        run: uv run python scripts/validate_epub.py --epubcheck epubcheck-5.1.0/epubcheck.jar

  security:
    name: Secret scan + dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history

      # ── Gate 2a: secret scanning (fingerprint ignores in .gitleaksignore) ──
      - name: Gitleaks
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner --redact .

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # ── Gate 2b: known-vulnerability audit of Python dependencies ──
      - name: pip-audit
        run: |
          uv sync -q
          uv run --with pip-audit pip-audit --skip-editable

  javascript:
    name: Typecheck + audit (JS/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared lib types
        # Fresh checkouts have no lib/*/dist — the UI's project references
        # need the built .d.ts files or tsc fails with TS6305 + implicit-any.
        run: pnpm run typecheck:libs

      - name: Typecheck UI
        run: pnpm --filter @workspace/orivellum-ui exec tsc --noEmit

      - name: Audit production dependencies
        run: pnpm audit --prod
