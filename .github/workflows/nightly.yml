name: Nightly

# Mutation testing: deliberately break the forensically critical modules
# (state machine, GENESIS ledger) and prove the tests notice. Too slow for
# every push, so it runs nightly; the survivor ceiling is a frozen baseline
# that may only shrink (scripts/check_mutation_score.py).

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC nightly
  workflow_dispatch: {}

jobs:
  mutation:
    name: Mutation testing (mutmut)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Run mutation testing
        env:
          SESSION_SECRET: ci-test-secret-not-a-real-key-padding-to-32-plus-chars
        # mutmut exits non-zero when mutants survive; the gate below decides.
        run: >
          uv run --with mutmut --with pytest --with pytest-asyncio
          --with hypothesis mutmut run || true

      - name: Collect results
        run: >
          uv run --with mutmut --with pytest --with pytest-asyncio
          --with hypothesis mutmut results > mutation-results.txt || true

      - name: Gate on surviving mutants (frozen baseline, only shrinks)
        run: python scripts/check_mutation_score.py mutation-results.txt
