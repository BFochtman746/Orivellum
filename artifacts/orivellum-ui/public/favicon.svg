<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- GD-industrial identity: hull-steel plate, stencil "O" ring with bridge
       gaps (land olive + sonar accents). Spec: design/GD-INDUSTRIAL.md -->
  <rect width="180" height="180" rx="36" fill="#14181D"/>
  <rect x="6" y="6" width="168" height="168" rx="31" fill="none" stroke="#39424C" stroke-width="2"/>
  <!-- stencil ring: two arcs with bridges at 12 and 6 o'clock -->
  <g stroke-width="18" fill="none" stroke-linecap="butt">
    <path d="M 90 34 A 56 56 0 0 1 90 146" stroke="#A8B36B" transform="rotate(14 90 90)"/>
    <path d="M 90 146 A 56 56 0 0 1 90 34" stroke="#3FC9B8" transform="rotate(14 90 90)"/>
  </g>
  <!-- bridge cuts -->
  <g fill="#14181D" transform="rotate(14 90 90)">
    <rect x="83" y="20" width="14" height="30"/>
    <rect x="83" y="130" width="14" height="30"/>
  </g>
</svg>
