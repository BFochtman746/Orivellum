<!DOCTYPE html>
<html lang="en" data-theme="daylight" data-text-size="100" data-measure="standard" data-reading-face="sans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Orivellum</title>
    <meta name="description" content="Orivellum — built on Replit. Update this description to reflect the app." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Orivellum" />
    <meta property="og:description" content="Orivellum — built on Replit. Update this description to reflect the app." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Orivellum" />
    <meta name="twitter:description" content="Orivellum — built on Replit. Update this description to reflect the app." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA / Home Screen install meta -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#F4F1E9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Orivellum" />
    <!-- Theme + calibration boot — runs before first paint so first paint is
         always the saved preference (Premium Daylight by default; 'system'
         follows the OS scheme). src/lib/theme.ts owns everything after mount.
         Palette source of truth: design/tokens.json (chrome colors mirrored
         here because CSS has not loaded yet at this point). -->
    <script>
      (function () {
        var root = document.documentElement;
        function get(k) {
          try { return localStorage.getItem(k); } catch (e) { return null; }
        }
        var pref = get('orivellum-theme');
        if (pref !== 'daylight' && pref !== 'hull' && pref !== 'system') pref = 'daylight';
        var resolved = pref;
        if (pref === 'system') {
          try {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'hull' : 'daylight';
          } catch (e) { resolved = 'daylight'; }
        }
        root.dataset.theme = resolved;
        root.style.colorScheme = resolved === 'hull' ? 'dark' : 'light';
        if (resolved === 'hull') {
          root.classList.add('dark');
          var tc = document.querySelector('meta[name="theme-color"]');
          if (tc) tc.setAttribute('content', '#14181D');
          var sb = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (sb) sb.setAttribute('content', 'black-translucent');
        }
        var ts = get('orivellum-text-size');
        if (ts === '112' || ts === '125') root.dataset.textSize = ts;
        var m = get('orivellum-measure');
        if (m === 'focused' || m === 'wide') root.dataset.measure = m;
        var f = get('orivellum-reading-face');
        if (f === 'serif') root.dataset.readingFace = f;
      })();
    </script>
    <!-- Fonts are self-hosted (@fontsource, bundled at build time). Interface
         copy uses the platform stack — no third-party font requests. -->
    <!--
      VisualViewport controller — sets --visual-viewport-height and
      --visual-viewport-offset-top on :root so the CSS app shell can
      track iPhone Safari's shrinking/growing address bar in real time.
      Runs synchronously before first paint to prevent layout shift.
    -->
    <script>
      (function () {
        var r = document.documentElement;
        function set(h, t) {
          r.style.setProperty('--visual-viewport-height', h + 'px');
          r.style.setProperty('--visual-viewport-offset-top', t + 'px');
        }
        // Synchronous initial value — use visualViewport if available, else innerHeight
        var vv = window.visualViewport;
        set(vv ? vv.height : window.innerHeight, vv ? vv.offsetTop : 0);
        function update() {
          var v = window.visualViewport;
          set(v ? v.height : window.innerHeight, v ? v.offsetTop : 0);
        }
        if (vv) {
          vv.addEventListener('resize', update, { passive: true });
          vv.addEventListener('scroll', update, { passive: true });
        }
        window.addEventListener('resize', update, { passive: true });
        // Orientation changes can delay reporting; fire twice to catch the settled value
        window.addEventListener('orientationchange', function () {
          setTimeout(update, 100);
          setTimeout(update, 500);
        }, { passive: true });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
