    <!-- Inter removed: system San Francisco / Segoe UI is used for sans-serif;
         Bricolage Grotesque + Fraunces + Space Mono load async from index.css -->
    <!--
      VisualViewport controller — sets --visual-viewport-height and
      --visual-viewport-offset-top on :root so the CSS app shell can
      track iPhone Safari's shrinking/growing address bar in real time.
      Runs synchronously before first paint to prevent layout shift.
    -->
    <script>
      (function () {
        var r = document.documentElement;
        function set(h, t) {
          r.style.setProperty('--visual-viewport-height', h + 'px');
          r.style.setProperty('--visual-viewport-offset-top', t + 'px');
        }
        // Synchronous initial value — use visualViewport if available, else innerHeight
        var vv = window.visualViewport;
        set(vv ? vv.height : window.innerHeight, vv ? vv.offsetTop : 0);
        function update() {
          var v = window.visualViewport;
          set(v ? v.height : window.innerHeight, v ? v.offsetTop : 0);
        }
        if (vv) {
          vv.addEventListener('resize', update, { passive: true });
          vv.addEventListener('scroll', update, { passive: true });
        }
        window.addEventListener('resize', update, { passive: true });
        // Orientation changes can delay reporting; fire twice to catch the settled value
        window.addEventListener('orientationchange', function () {
          setTimeout(update, 100);
          setTimeout(update, 500);
        }, { passive: true });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
