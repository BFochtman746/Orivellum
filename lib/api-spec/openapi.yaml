          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: Claims
          content:
            application/json:
              schema:
                type: object
                properties:
                  claims: { type: array, items: { $ref: "#/components/schemas/Claim" } }

  /claims/search:
    post:
      operationId: searchClaims
      summary: Search claims by text similarity
      tags: [claims]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                limit: { type: integer, default: 20 }
      responses:
        "200":
          description: Matching claims
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { $ref: "#/components/schemas/Claim" } }

  /claims/subject/{subject}:
    get:
      operationId: getClaimsBySubject
      summary: Get all claims for a given subject entity
      tags: [claims]
      parameters:
        - name: subject
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Claims for subject
          content:
            application/json:
              schema:
                type: object
                properties:
                  claims: { type: array, items: { $ref: "#/components/schemas/Claim" } }

  /claims/{claimId}:
    get:
      operationId: getClaim
      summary: Get a single claim
      tags: [claims]
      parameters:
        - name: claimId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Claim
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Claim" }
        "404":
          description: Not found
    delete:
      operationId: deleteClaim
      summary: Delete a claim
      tags: [claims]
      parameters:
        - name: claimId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }

  /claims/{claimId}/status:
    patch:
      operationId: updateClaimStatus
      summary: Update the verification status of a claim
      tags: [claims]
      parameters:
        - name: claimId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string }
                notes: { type: string, nullable: true }
      responses:
        "200":
          description: Updated claim
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Claim" }

  # ─── PKLOS ───────────────────────────────────────────────────────────────────
  /pklos/inventory:
    post:
