openapi: 3.0.3
info:
  title: api
  version: 0.1.0
  description: Orivellum local-first AI workspace API

servers:
  - url: /api

paths:
  # ─── Health ───────────────────────────────────────────────────────────────
  /healthz:
    get:
      operationId: getHealth
      summary: Health check
      tags: [health]
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      summary: Overall workspace statistics
      tags: [dashboard]
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }

  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      summary: Recent activity feed
      tags: [dashboard]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Activity list
          content:
            application/json:
              schema:
                type: object
                properties:
                  activity: { type: array, items: { $ref: "#/components/schemas/ActivityItem" } }

  # ─── Works ────────────────────────────────────────────────────────────────
  /works/types:
    get:
      operationId: getWorkTypes
      summary: List available Work types
      tags: [works]
      responses:
        "200":
          description: Work types
          content:
            application/json:
              schema:
                type: object
                properties:
                  types: { type: array, items: { $ref: "#/components/schemas/WorkType" } }

  /works:
    get:
      operationId: listWorks
      summary: List all Works
      tags: [works]
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: work_type
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Works list
          content:
            application/json:
              schema:
                type: object
                properties:
                  works: { type: array, items: { $ref: "#/components/schemas/Work" } }
    post:
      operationId: createWork
      summary: Create a new Work
      tags: [works]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkCreate" }
      responses:
        "200":
          description: Created Work
          content:
            application/json:
              schema:
                type: object
                properties:
                  work: { $ref: "#/components/schemas/Work" }

  # ─── Entities ─────────────────────────────────────────────────────────────
  /entities:
    get:
      operationId: listEntities
      summary: List all entities with mention counts
      tags: [entities]
      parameters:
        - name: kind
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 200 }
      responses:
        "200":
          description: Entity list
          content:
            application/json:
              schema:
                type: object
                properties:
                  entities: { type: array, items: { $ref: "#/components/schemas/Entity" } }
                  count: { type: integer }

  /entities/{entityId}:
    get:
      operationId: getEntity
      summary: Get a single entity with its mention list
      tags: [entities]
      parameters:
        - name: entityId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Entity with mentions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntityDetail" }
        "404":
          description: Not found

  /works/{workId}:
    get:
      operationId: getWork
      summary: Get a Work by ID
      tags: [works]
      parameters:
        - name: workId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Work
          content:
            application/json:
              schema:
                type: object
                properties:
                  work: { $ref: "#/components/schemas/Work" }
    patch:
      operationId: updateWork
      summary: Update a Work
      tags: [works]
      parameters:
        - name: workId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkUpdate" }
      responses:
        "200":
          description: Updated Work
          content:
            application/json:
              schema:
                type: object
                properties:
                  work: { $ref: "#/components/schemas/Work" }
    delete:
      operationId: deleteWork
      summary: Delete a Work
      tags: [works]
      parameters:
        - name: workId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }

  /works/{workId}/documents:
    get:
      operationId: getWorkDocuments
      summary: List documents for a Work
      tags: [works]
      parameters:
        - name: workId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents: { type: array, items: { $ref: "#/components/schemas/Document" } }
                  count: { type: integer }

  /works/{workId}/knowledge:
    get:
      operationId: getWorkKnowledge
      summary: List knowledge for a Work
      tags: [works]
      parameters:
        - name: workId
          in: path
          required: true
          schema: { type: string }
        - name: kind
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Knowledge items
          content:
            application/json:
              schema:
                type: object
                properties:
                  knowledge: { type: array, items: { $ref: "#/components/schemas/KnowledgeItem" } }
                  count: { type: integer }
    post:
      operationId: createWorkKnowledge
      summary: Manually add a knowledge item to a Work
      tags: [works]
      parameters:
        - name: workId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeCreate" }
      responses:
        "200":
          description: Created knowledge item
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: "#/components/schemas/KnowledgeItem" }

  /works/{workId}/tasks/{taskId}:
    patch:
      operationId: updateWorkTask
      summary: Update a task (status, text)
      tags: [works]
      parameters:
        - name: workId
          in: path
          required: true
          schema: { type: string }
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskUpdate" }
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                type: object
                properties:
                  task: { $ref: "#/components/schemas/Task" }
    delete:
      operationId: deleteWorkTask
      summary: Delete a task
      tags: [works]
      parameters:
        - name: workId
          in: path
          required: true
          schema: { type: string }
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /works/{workId}/tasks:
    get:
      operationId: getWorkTasks
      summary: List tasks for a Work
      tags: [works]
      parameters:
        - name: workId
          in: path
          required: true
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks: { type: array, items: { $ref: "#/components/schemas/Task" } }
                  count: { type: integer }
    post:
      operationId: createWorkTask
      summary: Create a task for a Work
      tags: [works]
      parameters:
        - name: workId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCreate" }
      responses:
        "200":
          description: Created task
          content:
            application/json:
              schema:
                type: object
                properties:
                  task: { $ref: "#/components/schemas/Task" }

  /works/{workId}/graph:
    get:
      operationId: getWorkGraph
      summary: Entity graph nodes and edges for a Work
      tags: [works]
      parameters:
        - name: workId
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
        - name: entity_kinds
          in: query
          schema: { type: string, description: "Comma-separated list of entity kinds to include (person,place,concept,theme,scripture)" }
      responses:
        "200":
          description: Work entity graph
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkGraph" }
        "404":
          description: Work not found

  /works/{workId}/completeness:
    get:
      operationId: getWorkCompleteness
      summary: Multi-dimensional completeness scoring for a Work
      tags: [works]
      parameters:
        - name: workId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Completeness report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompletenessReport" }
        "404":
          description: Work not found

  /works/{workId}/stats:
    get:
      operationId: getWorkStats
      summary: Get aggregated stats for a Work
      tags: [works]
      parameters:
        - name: workId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Work stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkStats" }

  /works/{workId}/conversations:
    get:
      operationId: getWorkConversations
      summary: List conversations for a Work
      tags: [works]
      parameters:
        - name: workId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations: { type: array, items: { $ref: "#/components/schemas/Conversation" } }

  # ─── Conversations ────────────────────────────────────────────────────────
  /conversations:
    get:
      operationId: listConversations
      summary: List all conversations
      tags: [conversations]
      parameters:
        - name: archived
          in: query
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations: { type: array, items: { $ref: "#/components/schemas/Conversation" } }
                  count: { type: integer }
    post:
      operationId: createConversation
      summary: Create a conversation
      tags: [conversations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationCreate" }
      responses:
        "200":
          description: Created conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation: { $ref: "#/components/schemas/Conversation" }

  /conversations/{convId}:
    get:
      operationId: getConversation
      summary: Get conversation with messages
      tags: [conversations]
      parameters:
        - name: convId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation: { $ref: "#/components/schemas/Conversation" }
                  messages: { type: array, items: { $ref: "#/components/schemas/Message" } }
    patch:
      operationId: updateConversation
      summary: Update conversation (rename, archive)
      tags: [conversations]
      parameters:
        - name: convId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationUpdate" }
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation: { $ref: "#/components/schemas/Conversation" }
    delete:
      operationId: deleteConversation
      summary: Delete a conversation
      tags: [conversations]
      parameters:
        - name: convId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }

  /conversations/{convId}/messages:
    post:
      operationId: sendMessage
      summary: Send a message in a conversation
      tags: [conversations]
      parameters:
        - name: convId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageSend" }
      responses:
        "200":
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: "#/components/schemas/Message" }

  # ─── Library ──────────────────────────────────────────────────────────────
  /library:
    get:
      operationId: listLibrary
      summary: List library documents
      tags: [library]
      parameters:
        - name: work_id
          in: query
          schema: { type: string }
        - name: kind
          in: query
          schema: { type: string }
        - name: readiness
          in: query
          schema: { type: string }
        - name: lifecycle
          in: query
          schema: { type: string, description: "Filter by lifecycle state: draft | canonical | superseded | reference" }
        - name: limit
          in: query
          schema: { type: integer, default: 200 }
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents: { type: array, items: { $ref: "#/components/schemas/Document" } }
                  count: { type: integer }

  /library/search:
    get:
      operationId: searchLibrary
      summary: Search library (keyword, semantic, or hybrid)
      tags: [library]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: work_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
        - name: mode
          in: query
          schema:
            type: string
            enum: [keyword, semantic, hybrid]
            default: hybrid
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  query: { type: string }
                  results: { type: array, items: { type: object } }
                  count: { type: integer }

  /library/duplicates:
    get:
      operationId: listDuplicates
      summary: List near-duplicate document pairs
      tags: [library]
      parameters:
        - name: resolved
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Duplicate pairs
          content:
            application/json:
              schema:
                type: object
                properties:
                  pairs: { type: array, items: { $ref: "#/components/schemas/DuplicatePair" } }
                  count: { type: integer }

  /library/duplicates/{dupeId}/resolve:
    post:
      operationId: resolveDuplicate
      summary: Resolve a near-duplicate pair
      tags: [library]
      parameters:
        - name: dupeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [keep_both, mark_versions, mark_superseded]
      responses:
        "200":
          description: Resolution recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  dupe_id: { type: string }
                  action: { type: string }
        "404":
          description: Pair not found

  /library/{docId}:
    get:
      operationId: getDocument
      summary: Get a single document
      tags: [library]
      parameters:
        - name: docId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: "#/components/schemas/Document" }

    patch:
      operationId: updateDocument
      summary: Update a document (e.g. assign/unlink work)
      tags: [library]
      parameters:
        - name: docId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                work_id: { type: string, nullable: true }
                title: { type: string, nullable: true }
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: "#/components/schemas/Document" }

    delete:
      operationId: deleteDocument
      summary: Delete a document
      tags: [library]
      parameters:
        - name: docId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /library/{docId}/lifecycle:
    patch:
      operationId: setDocumentLifecycle
      summary: Declare a document's authority state (draft | canonical | superseded | reference)
      tags: [library]
      parameters:
        - name: docId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lifecycle]
              properties:
                lifecycle: { type: string, description: "draft | canonical | superseded | reference" }
      responses:
        "200":
          description: Lifecycle updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  lifecycle: { type: string }
                  document: { $ref: "#/components/schemas/Document" }

  /library/import:
    post:
      operationId: importDocument
      summary: Import a document into the library
      tags: [library]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryImport" }
      responses:
        "200":
          description: Imported document
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: "#/components/schemas/Document" }
                  duplicate: { type: boolean }

  /library/{docId}/reprocess:
    post:
      operationId: reprocessDocument
      summary: Re-queue extraction for a document
      tags: [library]
      parameters:
        - name: docId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Reprocess queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }

  # ─── Knowledge ────────────────────────────────────────────────────────────
  /knowledge:
    get:
      operationId: listKnowledge
      summary: List knowledge items
      tags: [knowledge]
      parameters:
        - name: work_id
          in: query
          schema: { type: string }
        - name: kind
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: Knowledge items
          content:
            application/json:
              schema:
                type: object
                properties:
                  knowledge: { type: array, items: { $ref: "#/components/schemas/KnowledgeItem" } }
                  count: { type: integer }

  /knowledge/search:
    get:
      operationId: searchKnowledge
      summary: Search knowledge items
      tags: [knowledge]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: work_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  query: { type: string }
                  knowledge: { type: array, items: { $ref: "#/components/schemas/KnowledgeItem" } }
                  count: { type: integer }

  /knowledge/{itemId}:
    get:
      operationId: getKnowledgeItem
      summary: Get a single knowledge item
      tags: [knowledge]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Knowledge item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeItem" }
        "404":
          description: Not found
    delete:
      operationId: deleteKnowledgeItem
      summary: Permanently delete a knowledge item
      tags: [knowledge]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: string }

  /knowledge/{itemId}/review:
    patch:
      operationId: reviewKnowledgeItem
      summary: Approve or dismiss a knowledge item
      tags: [knowledge]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [review_status]
              properties:
                review_status: { type: string, enum: [auto, ai_auto, approved, rejected] }
      responses:
        "200":
          description: Review updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: string }
                  review_status: { type: string }

  # ─── Projects ─────────────────────────────────────────────────────────────
  /projects:
    get:
      operationId: listProjects
      summary: List mastery projects
      tags: [projects]
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects: { type: array, items: { $ref: "#/components/schemas/Project" } }
    post:
      operationId: createProject
      summary: Create a mastery project
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCreate" }
      responses:
        "200":
          description: Created project
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { $ref: "#/components/schemas/Project" }

  /projects/{projectId}:
    get:
      operationId: getProject
      summary: Get a project
      tags: [projects]
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { $ref: "#/components/schemas/Project" }

  # ─── Backups ──────────────────────────────────────────────────────────────
  /backups:
    get:
      operationId: listBackups
      summary: List backup files
      tags: [backups]
      responses:
        "200":
          description: Backups
          content:
            application/json:
              schema:
                type: object
                properties:
                  backups: { type: array, items: { $ref: "#/components/schemas/BackupFile" } }
                  count: { type: integer }
    post:
      operationId: createBackup
      summary: Create a backup now
      tags: [backups]
      responses:
        "200":
          description: Created backup
          content:
            application/json:
              schema:
                type: object
                properties:
                  backup: { $ref: "#/components/schemas/BackupFile" }

  /backups/{name}/verify:
    get:
      operationId: verifyBackup
      summary: Verify backup integrity
      tags: [backups]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
