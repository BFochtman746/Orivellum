            application/json:
              schema: { type: object }



  # ─── Claims ──────────────────────────────────────────────────────────────────
  /claims:
    post:
      operationId: createClaim
      summary: Create a new knowledge claim
      tags: [claims]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClaimCreate" }
      responses:
        "200":
          description: Created claim
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Claim" }
    get:
      operationId: listClaims
      summary: List all knowledge claims
      tags: [claims]
      parameters:
        - name: status
          in: query
          schema: { type: string }
