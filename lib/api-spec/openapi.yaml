      responses:
        "200":
          description: Report generation queued
          content:
            application/json:
              schema: { type: object }

  /generate/slides:
    post:
      operationId: generateSlides
      summary: Generate a slide deck for a Work
      tags: [studio]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                work_id: { type: string }
                title: { type: string }
      responses:
        "200":
          description: Slides generation queued
          content:
            application/json:
              schema: { type: object }

  /generate/bundle:
    post:
      operationId: generateBundle
      summary: Generate a downloadable bundle (ZIP) of all generated outputs
      tags: [studio]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                work_id: { type: string }
      responses:
        "200":
          description: Bundle generation queued
          content:
            application/json:
              schema: { type: object }

  /generate/download:
    get:
      operationId: downloadGenerated
      summary: Download a previously generated output
      tags: [studio]
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Generated file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

  # ─── Intake ──────────────────────────────────────────────────────────────────
  /intake:
    post:
      operationId: submitIntake
      summary: Submit a document or URL for automated intake and Work assignment
      tags: [library]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntakeRequest" }
      responses:
        "200":
          description: Intake result
          content:
            application/json:
              schema:
                type: object
                properties:
                  doc_id: { type: string }
                  work_id: { type: string, nullable: true }

  /intake/research:
    post:
      operationId: submitResearchIntake
      summary: Intake a research topic — triggers web search + document creation
      tags: [library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                work_id: { type: string, nullable: true }
                depth: { type: string, default: standard }
      responses:
        "200":
          description: Research intake queued
          content:
            application/json:
              schema: { type: object }

  /intake/{docId}:
    get:
      operationId: getIntakeStatus
      summary: Get the intake processing status of a document
      tags: [library]
      parameters:
        - name: docId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Intake status
          content:
            application/json:
              schema: { type: object }

  # ─── Write documents ─────────────────────────────────────────────────────────
  /write/documents:
    get:
      operationId: listWriteDocuments
      summary: List AI-assisted write documents
      tags: [studio]
      parameters:
        - name: work_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Write documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents: { type: array, items: { $ref: "#/components/schemas/WriteDocument" } }
    post:
      operationId: createWriteDocument
      summary: Create a new AI-assisted write document
      tags: [studio]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WriteDocumentCreate" }
      responses:
        "200":
          description: Created write document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteDocument" }

  /write/documents/{docId}:
    get:
      operationId: getWriteDocument
      summary: Get a write document by ID
      tags: [studio]
      parameters:
        - name: docId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Write document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteDocument" }
        "404":
          description: Not found
    patch:
      operationId: updateWriteDocument
      summary: Update a write document
      tags: [studio]
      parameters:
        - name: docId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Updated write document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriteDocument" }
    delete:
      operationId: deleteWriteDocument
      summary: Delete a write document
      tags: [studio]
      parameters:
        - name: docId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }

  /write/documents/{docId}/ai:
    post:
      operationId: aiAssistWriteDocument
      summary: Generate or improve content for a write document using AI
      tags: [studio]
      parameters:
        - name: docId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instruction]
              properties:
                instruction: { type: string }
                mode: { type: string, default: improve }
      responses:
        "200":
          description: AI-generated content
          content:
            application/json:
              schema: { type: object }

  /write/documents/{docId}/export/txt:
    get:
      operationId: exportWriteDocumentTxt
      summary: Export a write document as plain text
      tags: [studio]
      parameters:
        - name: docId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Plain-text export
          content:
            text/plain:
              schema: { type: string }


  /download/{filePath}:
    get:
      operationId: downloadFile
      summary: Download a file by path
      tags: [files]
      parameters:
        - name: filePath
          in: path
          required: true
          schema: { type: string }
          description: Forward-slash-separated path to the file
      responses:
        "200":
          description: File content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }


components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
        version: { type: string }
        timestamp: { type: string, format: date-time }

    DashboardSummary:
      type: object
      properties:
        work_count: { type: integer }
        document_count: { type: integer }
        documents_ready: { type: integer }
        knowledge_count: { type: integer }
        conversation_count: { type: integer }
        pending_task_count: { type: integer }
        recent_works: { type: array, items: { $ref: "#/components/schemas/Work" } }
        recent_documents:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              kind: { type: string }
              readiness: { type: string }
              created_at: { type: string }
        recent_conversations:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string, nullable: true }
              model: { type: string, nullable: true }
              updated_at: { type: string }
              last_message: { type: string, nullable: true }

    ActivityItem:
      type: object
      properties:
        kind: { type: string }
        id: { type: string }
        label: { type: string }
        created_at: { type: string, format: date-time }

    Work:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        work_type: { type: string }
        description: { type: string, nullable: true }
        status: { type: string }
        meta: { type: object }
        cover_path: { type: string, nullable: true, description: "Data-dir-relative cover image path; serve via GET /works/{id}/cover" }
        doc_count: { type: integer }
        knowledge_count: { type: integer }
        pending_tasks: { type: integer }
        created_at: { type: string }
        updated_at: { type: string }

    WorkType:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }

    WorkCreate:
      type: object
      required: [title]
      properties:
        title: { type: string }
        work_type: { type: string, default: research }
        description: { type: string, nullable: true }
        meta: { type: object }

    WorkUpdate:
      type: object
      properties:
        title: { type: string, nullable: true }
        description: { type: string, nullable: true }
        status: { type: string, nullable: true }
        work_type: { type: string, nullable: true }
        meta: { type: object, nullable: true }

    WorkStats:
      type: object
      properties:
        work_id: { type: string }
        documents_by_kind: { type: object }
        knowledge_by_kind: { type: object }
        tasks_by_status: { type: object }

    Document:
      type: object
      properties:
        id: { type: string }
        work_id: { type: string, nullable: true }
        title: { type: string, nullable: true }
        source: { type: string, nullable: true }
        sha256: { type: string, nullable: true }
        kind: { type: string, nullable: true }
        classification: { type: string, nullable: true }
        readiness: { type: string }
        lifecycle: { type: string, nullable: true, description: "draft | canonical | superseded | reference" }
        word_count: { type: integer, nullable: true }
        error_message: { type: string, nullable: true }
        meta: { type: object }
        created_at: { type: string }

    LibraryImport:
      type: object
      required: [filename, content_b64]
      properties:
        filename: { type: string }
        content_b64: { type: string }
        work_id: { type: string, nullable: true }
        meta: { type: object }

    KnowledgeItem:
      type: object
      properties:
        id: { type: string }
        work_id: { type: string, nullable: true }
        kind: { type: string }
        text: { type: string }
        subject: { type: string, nullable: true }
        predicate: { type: string, nullable: true }
        object: { type: string, nullable: true }
        confidence: { type: number }
        review_status: { type: string }
        created_at: { type: string }

    Task:
      type: object
      properties:
        id: { type: string }
        work_id: { type: string, nullable: true }
        text: { type: string }
        status: { type: string }
        priority: { type: integer }
        created_at: { type: string }

    TaskUpdate:
      type: object
      properties:
        status: { type: string, nullable: true }
        text: { type: string, nullable: true }
        priority: { type: integer, nullable: true }

    TaskCreate:
      type: object
      required: [text]
      properties:
        text: { type: string }
        priority: { type: integer, default: 0 }

    Conversation:
      type: object
      properties:
        id: { type: string }
        work_id: { type: string, nullable: true }
        work_title: { type: string, nullable: true }
        title: { type: string, nullable: true }
        archived: { type: integer }
        model: { type: string, nullable: true }
        last_message: { type: string, nullable: true }
        message_count: { type: integer }
        created_at: { type: string }
        updated_at: { type: string }

    ModelOption:
      type: object
      properties:
        id: { type: string }
        role: { type: string }
        label: { type: string }
        description: { type: string }

    ModelList:
      type: object
      properties:
        models: { type: array, items: { $ref: "#/components/schemas/ModelOption" } }
        default: { type: string }

    ConversationCreate:
      type: object
      properties:
        title: { type: string, nullable: true }
        work_id: { type: string, nullable: true }
        model: { type: string, nullable: true }
        persona_id: { type: string, nullable: true, description: "Built-in persona slug (default, story_partner, technical_editor, research_assistant, devils_advocate). Omit or set null for the default persona." }

    ConversationUpdate:
      type: object
      properties:
        title: { type: string, nullable: true }
        archived: { type: boolean, nullable: true }
        model: { type: string, nullable: true }

    Message:
      type: object
      properties:
        id: { type: string }
        conversation_id: { type: string }
        role: { type: string }
        text: { type: string }
        meta: { type: object }
        created_at: { type: string }

    MessageSend:
      type: object
      required: [text]
      properties:
        text: { type: string }
        stream: { type: boolean, default: false }
        deep: { type: boolean, default: false }
        scope: { type: string, default: work, enum: [work, all] }
        image_b64: { type: string, nullable: true }
        image_media_type: { type: string, default: image/jpeg }
        client_msg_id: { type: string, nullable: true }
        context_doc_ids:
          type: array
          nullable: true
          items: { type: string }
          description: "Document IDs to pin verbatim into the context for this message. Work-boundary enforced server-side."

    Project:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        work_id: { type: string, nullable: true }
        mastery: { type: number }
        last_review: { type: string, nullable: true }
        created_at: { type: string }

    ProjectCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        work_id: { type: string, nullable: true }

    BackupFile:
      type: object
      properties:
        name: { type: string }
        size_bytes: { type: integer }
        created_at: { type: string }

    Voice:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        engine: { type: string }
        builtin: { type: boolean }

    FileList:
      type: object
      properties:
        files: { type: array, items: { type: object } }
        dirs: { type: array, items: { type: object } }
        path: { type: string }

    UploadRequest:
      type: object
      required: [filename, content_b64]
      properties:
        filename: { type: string }
        content_b64: { type: string }
        subdir: { type: string, default: intake }

    UploadResponse:
      type: object
      properties:
        ok: { type: boolean }
        filename: { type: string }
        path: { type: string }
        size_bytes: { type: integer }

    SystemHealth:
      type: object
      properties:
        status: { type: string }
        services:
          type: object
          properties:
            database: { type: object }
            ai: { type: object }

    Capability:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string }

    Briefing:
      type: object
      properties:
        date: { type: string }
        summary: { $ref: "#/components/schemas/DashboardSummary" }
        greeting: { type: string }

    DuplicatePair:
      type: object
      properties:
        id: { type: string }
        doc_a_id: { type: string }
        doc_b_id: { type: string }
        doc_a_title: { type: string, nullable: true }
        doc_b_title: { type: string, nullable: true }
        similarity: { type: number }
        kind: { type: string, description: "near_duplicate | likely_revision" }
        resolved: { type: integer }
        resolution: { type: string, nullable: true }
        created_at: { type: string }

    Entity:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string }
        canonical: { type: integer }
        aliases: { type: string }
        meta: { type: object }
        created_at: { type: string }
        mention_count: { type: integer }

    EntityDetail:
      allOf:
        - $ref: "#/components/schemas/Entity"
        - type: object
          properties:
            mentions:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  title: { type: string }
                  kind: { type: string }
                  work_id: { type: string, nullable: true }

    GraphNode:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        type: { type: string, description: "entity | document" }
        kind: { type: string, description: "person | place | concept | theme | document | etc." }

    GraphEdge:
      type: object
      properties:
        source: { type: string }
        target: { type: string }
        label: { type: string }
        type: { type: string }

    WorkGraph:
      type: object
      properties:
        work_id: { type: string }
        nodes: { type: array, items: { $ref: "#/components/schemas/GraphNode" } }
        edges: { type: array, items: { $ref: "#/components/schemas/GraphEdge" } }
        node_count: { type: integer }
        edge_count: { type: integer }

    CompletenessDimension:
      type: object
      properties:
        name: { type: string, description: "structural | content | research | editorial | source" }
        label: { type: string }
        score: { type: integer, description: "0-100" }
        current: { type: number }
        target: { type: number }
        unit: { type: string }
        rule: { type: string }
        evidence: { type: array, items: { type: string } }

    CompletenessReport:
      type: object
      properties:
        work_id: { type: string }
        work_title: { type: string }
        overall: { type: integer, description: "Weighted overall score 0-100" }
        readiness: { type: string, description: "Draft | Developing | Substantial | Near-Complete | Ready" }
        summary: { type: string }
        evaluated_at: { type: string }
        dimensions:
          type: array
          items: { $ref: "#/components/schemas/CompletenessDimension" }

    GapItem:
      type: object
      properties:
        kind:        { type: string, description: "undocumented_doc | uncovered_chapter | weak_coverage | missing_sources | orphaned_research | stale_source | duplicate_research | no_structure" }
        title:       { type: string }
        description: { type: string }
        severity:    { type: string, description: "high | medium | low" }
        metadata:    { type: object, additionalProperties: true }

    GapReport:
      type: object
      properties:
        work_id:           { type: string }
        coverage_pct:      { type: integer, description: "0-100 — chapters with sufficient coverage" }
        total_chapters:    { type: integer }
        suggested_queries: { type: array, items: { type: string } }
        evaluated_at:      { type: string }
        gaps:
          type: array
          items: { $ref: "#/components/schemas/GapItem" }

    TopGapItem:
      allOf:
        - $ref: "#/components/schemas/GapItem"
        - type: object
          properties:
            work_id:    { type: string }
            work_title: { type: string }

    TopGapsResponse:
      type: object
      properties:
        gaps:
          type: array
          items: { $ref: "#/components/schemas/TopGapItem" }
        total_works_analyzed: { type: integer }

    OkResponse:
      type: object
      properties:
        ok: { type: boolean }

    GlobalGraph:
      type: object
      properties:
        nodes: { type: array, items: { $ref: "#/components/schemas/GraphNode" } }
        edges: { type: array, items: { $ref: "#/components/schemas/GraphEdge" } }
        node_count: { type: integer }
        edge_count: { type: integer }

    Pipeline:
      type: object
      properties:
        work_id: { type: string }
        state: { type: string }
        stage: { type: string }
        target_word_count: { type: integer, nullable: true }
        findings: { type: array, items: { type: object } }
        history: { type: array, items: { type: object } }
        created_at: { type: string }
        updated_at: { type: string }

    LearningSummary:
      type: object
      properties:
        work_id: { type: string }
        total_concepts: { type: integer }
        mastered: { type: integer }
        in_progress: { type: integer }
        not_started: { type: integer }
        mastery_pct: { type: number }

    LearningConcept:
      type: object
      properties:
        id: { type: string }
        work_id: { type: string }
        title: { type: string }
        mastery: { type: number }
        attempts: { type: integer }
        last_reviewed: { type: string, nullable: true }

    LearningQuestion:
      type: object
      properties:
        concept_id: { type: string }
        concept_title: { type: string }
        question: { type: string }
        kind: { type: string, description: "multiple_choice | open" }
        options: { type: array, items: { type: string }, nullable: true }

    LearningAssessBody:
      type: object
      required: [concept_id, answer]
      properties:
        concept_id: { type: string }
        answer: { type: string }
        question: { type: string }

    LearningAssessResult:
      type: object
      properties:
        correct: { type: boolean }
        score: { type: number }
        feedback: { type: string }
        mastery: { type: number }
        explanation: { type: string, nullable: true }

    ReviewItem:
      type: object
      properties:
        id: { type: string }
        item_type: { type: string }
        item_id: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        severity: { type: string, nullable: true }
        created_at: { type: string }
        meta: { type: object }

    ReviewResolveBody:
      type: object
      required: [action]
      properties:
        action: { type: string }
        reason: { type: string, nullable: true }
        target_id: { type: string, nullable: true }

    MemoryFact:
      type: object
      properties:
        id: { type: string }
        key: { type: string }
        value: { type: string }
        source: { type: string, nullable: true }
        created_at: { type: string }

    SystemJob:
      type: object
      properties:
        id: { type: string }
        kind: { type: string }
        state: { type: string }
        doc_id: { type: string, nullable: true }
        meta: { type: object }
        started_at: { type: string, nullable: true }
        finished_at: { type: string, nullable: true }
        created_at: { type: string }

    Action:
      type: object
      properties:
        name: { type: string }
        label: { type: string }
        description: { type: string }
        input_schema: { type: object }

    ActionRun:
      type: object
      properties:
        id: { type: string }
        action_name: { type: string }
        state: { type: string }
        inputs: { type: object }
        outputs: { type: object, nullable: true }
        error: { type: string, nullable: true }
        created_at: { type: string }
        finished_at: { type: string, nullable: true }

    McoBenchmark:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        prompt_slot: { type: string }
        weight: { type: number }

    McosRun:
      type: object
      properties:
        id: { type: string }
        benchmark_id: { type: string }
        state: { type: string }
        score: { type: number, nullable: true }
        delta: { type: number, nullable: true }
        findings: { type: array, items: { type: object } }
        started_at: { type: string }
        finished_at: { type: string, nullable: true }

    McosPrompt:
      type: object
      properties:
        id: { type: string }
        slot: { type: string }
        text: { type: string }
        active: { type: boolean }
        created_at: { type: string }

    McosPromptCreate:
      type: object
      required: [slot, text]
      properties:
        slot: { type: string }
        text: { type: string }

    KnowledgeCreate:
      type: object
      required: [text]
      properties:
        kind: { type: string, default: fact }
        text: { type: string }
        subject: { type: string, nullable: true }
        predicate: { type: string, nullable: true }
        object: { type: string, nullable: true }
        confidence: { type: number, default: 1.0 }

    TTSRequest:
      type: object
      required: [text]
      properties:
        text: { type: string }
        voice: { type: string, nullable: true }
        return_url: { type: boolean, default: false }

    DocumentTTSRequest:
      type: object
      required: [doc_id]
      properties:
        doc_id: { type: string }
        voice: { type: string, nullable: true }
        return_url: { type: boolean, default: true }

    ImageGenRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string }
        negative_prompt: { type: string, nullable: true }
        width: { type: integer, default: 512 }
        height: { type: integer, default: 512 }
        steps: { type: integer, default: 20 }

    Claim:
      type: object
      properties:
        id: { type: string }
        text: { type: string }
        subject: { type: string, nullable: true }
        predicate: { type: string, nullable: true }
        object: { type: string, nullable: true }
        status: { type: string }
        work_id: { type: string, nullable: true }
        source_doc_id: { type: string, nullable: true }
        created_at: { type: string }

    ClaimCreate:
      type: object
      required: [text]
      properties:
        text: { type: string }
        subject: { type: string, nullable: true }
        predicate: { type: string, nullable: true }
        object: { type: string, nullable: true }
        work_id: { type: string, nullable: true }
        source_doc_id: { type: string, nullable: true }

    IntakeRequest:
      type: object
      properties:
        url: { type: string, nullable: true }
        text: { type: string, nullable: true }
        work_id: { type: string, nullable: true }
        title: { type: string, nullable: true }

    WriteDocument:
      type: object
      properties:
        id: { type: string }
        work_id: { type: string, nullable: true }
        title: { type: string }
        content: { type: string }
        kind: { type: string }
        created_at: { type: string }
        updated_at: { type: string }

    WriteDocumentCreate:
      type: object
      required: [title]
      properties:
        title: { type: string }
        work_id: { type: string, nullable: true }
        kind: { type: string, default: document }
        content: { type: string, default: "" }
