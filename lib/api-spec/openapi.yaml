openapi: 3.0.3
info:
  title: api
  version: 0.1.0
  description: Orivellum local-first AI workspace API

servers:
  - url: /api

paths:
  # ─── Health ───────────────────────────────────────────────────────────────
  /healthz:
    get:
      operationId: getHealth
      summary: Health check
      tags: [health]
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      summary: Overall workspace statistics
      tags: [dashboard]
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }

  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      summary: Recent activity feed
      tags: [dashboard]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Activity list
          content:
            application/json:
              schema:
                type: object
                properties:
                  activity: { type: array, items: { $ref: "#/components/schemas/ActivityItem" } }

  # ─── Works ────────────────────────────────────────────────────────────────
  /works/types:
    get:
      operationId: getWorkTypes
      summary: List available Work types
      tags: [works]
      responses:
        "200":
          description: Work types
          content:
            application/json:
              schema:
                type: object
                properties:
                  types: { type: array, items: { $ref: "#/components/schemas/WorkType" } }

  /works:
    get:
      operationId: listWorks
      summary: List all Works
      tags: [works]
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: work_type
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Works list
          content:
            application/json:
              schema:
                type: object
                properties:
                  works: { type: array, items: { $ref: "#/components/schemas/Work" } }
    post:
      operationId: createWork
      summary: Create a new Work
      tags: [works]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkCreate" }
      responses:
        "200":
          description: Created Work
          content:
            application/json:
              schema:
                type: object
                properties:
                  work: { $ref: "#/components/schemas/Work" }

  # ─── Entities ─────────────────────────────────────────────────────────────
  /entities:
    get:
      operationId: listEntities
      summary: List all entities with mention counts
      tags: [entities]
      parameters:
        - name: kind
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 200 }
      responses:
        "200":
          description: Entity list
          content:
            application/json:
              schema:
                type: object
                properties:
                  entities: { type: array, items: { $ref: "#/components/schemas/Entity" } }
                  count: { type: integer }

  /entities/{entityId}:
    get:
      operationId: getEntity
      summary: Get a single entity with its mention list
      tags: [entities]
      parameters:
        - name: entityId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Entity with mentions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntityDetail" }
        "404":
          description: Not found

  /works/{workId}:
    get:
      operationId: getWork
      summary: Get a Work by ID
      tags: [works]
      parameters:
        - name: workId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Work
          content:
            application/json:
              schema:
                type: object
                properties:
                  work: { $ref: "#/components/schemas/Work" }
    patch:
      operationId: updateWork
      summary: Update a Work
      tags: [works]
      parameters:
        - name: workId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkUpdate" }
      responses:
        "200":
          description: Updated Work
          content:
            application/json:
              schema:
                type: object
                properties:
                  work: { $ref: "#/components/schemas/Work" }
    delete:
      operationId: deleteWork
      summary: Delete a Work
      tags: [works]
      parameters:
        - name: workId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }

  /works/{workId}/documents:
    get:
      operationId: getWorkDocuments
      summary: List documents for a Work
      tags: [works]
      parameters:
        - name: workId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents: { type: array, items: { $ref: "#/components/schemas/Document" } }
                  count: { type: integer }

  /works/{workId}/knowledge:
    get:
      operationId: getWorkKnowledge
      summary: List knowledge for a Work
      tags: [works]
      parameters:
        - name: workId
          in: path
          required: true
          schema: { type: string }
        - name: kind
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Knowledge items
          content:
            application/json:
              schema:
                type: object
                properties:
                  knowledge: { type: array, items: { $ref: "#/components/schemas/KnowledgeItem" } }
                  count: { type: integer }

  /works/{workId}/tasks/{taskId}:
    patch:
      operationId: updateWorkTask
      summary: Update a task (status, text)
      tags: [works]
      parameters:
        - name: workId
          in: path
          required: true
          schema: { type: string }
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskUpdate" }
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                type: object
                properties:
                  task: { $ref: "#/components/schemas/Task" }

  /works/{workId}/tasks:
    get:
      operationId: getWorkTasks
      summary: List tasks for a Work
      tags: [works]
      parameters:
        - name: workId
          in: path
          required: true
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks: { type: array, items: { $ref: "#/components/schemas/Task" } }
                  count: { type: integer }
    post:
      operationId: createWorkTask
      summary: Create a task for a Work
      tags: [works]
      parameters:
        - name: workId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCreate" }
      responses:
        "200":
          description: Created task
          content:
            application/json:
              schema:
                type: object
                properties:
                  task: { $ref: "#/components/schemas/Task" }

  /works/{workId}/graph:
    get:
      operationId: getWorkGraph
      summary: Entity graph nodes and edges for a Work
      tags: [works]
      parameters:
        - name: workId
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: Work entity graph
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkGraph" }
        "404":
          description: Work not found

  /works/{workId}/completeness:
    get:
      operationId: getWorkCompleteness
      summary: Multi-dimensional completeness scoring for a Work
      tags: [works]
      parameters:
        - name: workId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Completeness report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompletenessReport" }
        "404":
          description: Work not found

  /works/{workId}/stats:
    get:
      operationId: getWorkStats
      summary: Get aggregated stats for a Work
      tags: [works]
      parameters:
        - name: workId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Work stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkStats" }

  /works/{workId}/conversations:
    get:
      operationId: getWorkConversations
      summary: List conversations for a Work
      tags: [works]
      parameters:
        - name: workId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations: { type: array, items: { $ref: "#/components/schemas/Conversation" } }

  # ─── Conversations ────────────────────────────────────────────────────────
  /conversations:
    get:
      operationId: listConversations
      summary: List all conversations
      tags: [conversations]
      parameters:
        - name: archived
          in: query
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations: { type: array, items: { $ref: "#/components/schemas/Conversation" } }
                  count: { type: integer }
    post:
      operationId: createConversation
      summary: Create a conversation
      tags: [conversations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationCreate" }
      responses:
        "200":
          description: Created conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation: { $ref: "#/components/schemas/Conversation" }

  /conversations/{convId}:
    get:
      operationId: getConversation
      summary: Get conversation with messages
      tags: [conversations]
      parameters:
        - name: convId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation: { $ref: "#/components/schemas/Conversation" }
                  messages: { type: array, items: { $ref: "#/components/schemas/Message" } }
    patch:
      operationId: updateConversation
      summary: Update conversation (rename, archive)
      tags: [conversations]
      parameters:
        - name: convId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationUpdate" }
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversation: { $ref: "#/components/schemas/Conversation" }
    delete:
      operationId: deleteConversation
      summary: Delete a conversation
      tags: [conversations]
      parameters:
        - name: convId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }

  /conversations/{convId}/messages:
    post:
      operationId: sendMessage
      summary: Send a message in a conversation
      tags: [conversations]
      parameters:
        - name: convId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageSend" }
      responses:
        "200":
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: "#/components/schemas/Message" }

  # ─── Library ──────────────────────────────────────────────────────────────
  /library:
    get:
      operationId: listLibrary
      summary: List library documents
      tags: [library]
      parameters:
        - name: work_id
          in: query
          schema: { type: string }
        - name: kind
          in: query
          schema: { type: string }
        - name: readiness
          in: query
          schema: { type: string }
        - name: lifecycle
          in: query
          schema: { type: string, description: "Filter by lifecycle state: draft | canonical | superseded | reference" }
        - name: limit
          in: query
          schema: { type: integer, default: 200 }
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents: { type: array, items: { $ref: "#/components/schemas/Document" } }
                  count: { type: integer }

  /library/search:
    get:
      operationId: searchLibrary
      summary: Search library (keyword, semantic, or hybrid)
      tags: [library]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: work_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
        - name: mode
          in: query
          schema:
            type: string
            enum: [keyword, semantic, hybrid]
            default: hybrid
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  query: { type: string }
                  results: { type: array, items: { type: object } }
                  count: { type: integer }

  /library/duplicates:
    get:
      operationId: listDuplicates
      summary: List near-duplicate document pairs
      tags: [library]
      parameters:
        - name: resolved
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Duplicate pairs
          content:
            application/json:
              schema:
                type: object
                properties:
                  pairs: { type: array, items: { $ref: "#/components/schemas/DuplicatePair" } }
                  count: { type: integer }

  /library/duplicates/{dupeId}/resolve:
    post:
      operationId: resolveDuplicate
      summary: Resolve a near-duplicate pair
      tags: [library]
      parameters:
        - name: dupeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [keep_both, mark_versions, mark_superseded]
      responses:
        "200":
          description: Resolution recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  dupe_id: { type: string }
                  action: { type: string }
        "404":
          description: Pair not found

  /library/{docId}:
    get:
      operationId: getDocument
      summary: Get a single document
      tags: [library]
      parameters:
        - name: docId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: "#/components/schemas/Document" }

    patch:
      operationId: updateDocument
      summary: Update a document (e.g. assign/unlink work)
      tags: [library]
      parameters:
        - name: docId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                work_id: { type: string, nullable: true }
                title: { type: string, nullable: true }
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: "#/components/schemas/Document" }

    delete:
      operationId: deleteDocument
      summary: Delete a document
      tags: [library]
      parameters:
        - name: docId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /library/{docId}/lifecycle:
    patch:
      operationId: setDocumentLifecycle
      summary: Declare a document's authority state (draft | canonical | superseded | reference)
      tags: [library]
      parameters:
        - name: docId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lifecycle]
              properties:
                lifecycle: { type: string, description: "draft | canonical | superseded | reference" }
      responses:
        "200":
          description: Lifecycle updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  lifecycle: { type: string }
                  document: { $ref: "#/components/schemas/Document" }

  /library/import:
    post:
      operationId: importDocument
      summary: Import a document into the library
      tags: [library]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryImport" }
      responses:
        "200":
          description: Imported document
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: "#/components/schemas/Document" }
                  duplicate: { type: boolean }

  /library/{docId}/reprocess:
    post:
      operationId: reprocessDocument
      summary: Re-queue extraction for a document
      tags: [library]
      parameters:
        - name: docId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Reprocess queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }

  # ─── Knowledge ────────────────────────────────────────────────────────────
  /knowledge:
    get:
      operationId: listKnowledge
      summary: List knowledge items
      tags: [knowledge]
      parameters:
        - name: work_id
          in: query
          schema: { type: string }
        - name: kind
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: Knowledge items
          content:
            application/json:
              schema:
                type: object
                properties:
                  knowledge: { type: array, items: { $ref: "#/components/schemas/KnowledgeItem" } }
                  count: { type: integer }

  /knowledge/search:
    get:
      operationId: searchKnowledge
      summary: Search knowledge items
      tags: [knowledge]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: work_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  query: { type: string }
                  knowledge: { type: array, items: { $ref: "#/components/schemas/KnowledgeItem" } }
                  count: { type: integer }

  /knowledge/{itemId}:
    delete:
      operationId: deleteKnowledgeItem
      summary: Permanently delete a knowledge item
      tags: [knowledge]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: string }

  /knowledge/{itemId}/review:
    patch:
      operationId: reviewKnowledgeItem
      summary: Approve or dismiss a knowledge item
      tags: [knowledge]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [review_status]
              properties:
                review_status: { type: string, enum: [auto, ai_auto, approved, rejected] }
      responses:
        "200":
          description: Review updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: string }
                  review_status: { type: string }

  # ─── Projects ─────────────────────────────────────────────────────────────
  /projects:
    get:
      operationId: listProjects
      summary: List mastery projects
      tags: [projects]
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects: { type: array, items: { $ref: "#/components/schemas/Project" } }
    post:
      operationId: createProject
      summary: Create a mastery project
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectCreate" }
      responses:
        "200":
          description: Created project
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { $ref: "#/components/schemas/Project" }

  /projects/{projectId}:
    get:
      operationId: getProject
      summary: Get a project
      tags: [projects]
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { $ref: "#/components/schemas/Project" }

  # ─── Backups ──────────────────────────────────────────────────────────────
  /backups:
    get:
      operationId: listBackups
      summary: List backup files
      tags: [backups]
      responses:
        "200":
          description: Backups
          content:
            application/json:
              schema:
                type: object
                properties:
                  backups: { type: array, items: { $ref: "#/components/schemas/BackupFile" } }
                  count: { type: integer }
    post:
      operationId: createBackup
      summary: Create a backup now
      tags: [backups]
      responses:
        "200":
          description: Created backup
          content:
            application/json:
              schema:
                type: object
                properties:
                  backup: { $ref: "#/components/schemas/BackupFile" }

  /backups/{name}/verify:
    get:
      operationId: verifyBackup
      summary: Verify backup integrity
      tags: [backups]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  member_count: { type: integer }
                  has_db: { type: boolean }

  # ─── Studio ───────────────────────────────────────────────────────────────
  /studio/voices:
    get:
      operationId: listVoices
      summary: List available TTS voices
      tags: [studio]
      responses:
        "200":
          description: Voices
          content:
            application/json:
              schema:
                type: object
                properties:
                  voices: { type: array, items: { $ref: "#/components/schemas/Voice" } }

  /studio/outputs:
    get:
      operationId: listStudioOutputs
      summary: List generated output files
      tags: [studio]
      responses:
        "200":
          description: Outputs
          content:
            application/json:
              schema:
                type: object
                properties:
                  outputs: { type: array, items: { type: object } }
                  count: { type: integer }

  # ─── Files ────────────────────────────────────────────────────────────────
  /files:
    get:
      operationId: listFiles
      summary: List files in data directory
      tags: [files]
      parameters:
        - name: subdir
          in: query
          schema: { type: string, default: "" }
      responses:
        "200":
          description: Files and directories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileList" }

  /upload:
    post:
      operationId: uploadFile
      summary: Upload a file
      tags: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadRequest" }
      responses:
        "200":
          description: Uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResponse" }

  # ─── System ───────────────────────────────────────────────────────────────
  /system/models:
    get:
      operationId: getSystemModels
      summary: List available AI models
      tags: [system]
      responses:
        "200":
          description: Available models
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelList" }

  /system/health:
    get:
      operationId: getSystemHealth
      summary: Detailed system health with all services
      tags: [system]
      responses:
        "200":
          description: System health
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemHealth" }

  /system/capabilities:
    get:
      operationId: listCapabilities
      summary: List capability modules and their status
      tags: [system]
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema:
                type: object
                properties:
                  capabilities: { type: array, items: { $ref: "#/components/schemas/Capability" } }

  /briefing:
    get:
      operationId: getBriefing
      summary: Daily workspace briefing
      tags: [system]
      responses:
        "200":
          description: Briefing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Briefing" }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
        version: { type: string }
        timestamp: { type: string, format: date-time }

    DashboardSummary:
      type: object
      properties:
        work_count: { type: integer }
        document_count: { type: integer }
        documents_ready: { type: integer }
        knowledge_count: { type: integer }
        conversation_count: { type: integer }
        pending_task_count: { type: integer }
        recent_works: { type: array, items: { $ref: "#/components/schemas/Work" } }
        recent_documents:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              kind: { type: string }
              readiness: { type: string }
              created_at: { type: string }
        recent_conversations:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string, nullable: true }
              model: { type: string, nullable: true }
              updated_at: { type: string }
              last_message: { type: string, nullable: true }

    ActivityItem:
      type: object
      properties:
        kind: { type: string }
        id: { type: string }
        label: { type: string }
        created_at: { type: string, format: date-time }

    Work:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        work_type: { type: string }
        description: { type: string, nullable: true }
        status: { type: string }
        meta: { type: object }
        doc_count: { type: integer }
        knowledge_count: { type: integer }
        pending_tasks: { type: integer }
        created_at: { type: string }
        updated_at: { type: string }

    WorkType:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }

    WorkCreate:
      type: object
      required: [title]
      properties:
        title: { type: string }
        work_type: { type: string, default: research }
        description: { type: string, nullable: true }
        meta: { type: object }

    WorkUpdate:
      type: object
      properties:
        title: { type: string, nullable: true }
        description: { type: string, nullable: true }
        status: { type: string, nullable: true }
        meta: { type: object, nullable: true }

    WorkStats:
      type: object
      properties:
        work_id: { type: string }
        documents_by_kind: { type: object }
        knowledge_by_kind: { type: object }
        tasks_by_status: { type: object }

    Document:
      type: object
      properties:
        id: { type: string }
        work_id: { type: string, nullable: true }
        title: { type: string, nullable: true }
        source: { type: string, nullable: true }
        sha256: { type: string, nullable: true }
        kind: { type: string, nullable: true }
        classification: { type: string, nullable: true }
        readiness: { type: string }
        lifecycle: { type: string, nullable: true, description: "draft | canonical | superseded | reference" }
        word_count: { type: integer, nullable: true }
        error_message: { type: string, nullable: true }
        meta: { type: object }
        created_at: { type: string }

    LibraryImport:
      type: object
      required: [filename, content_b64]
      properties:
        filename: { type: string }
        content_b64: { type: string }
        work_id: { type: string, nullable: true }
        meta: { type: object }

    KnowledgeItem:
      type: object
      properties:
        id: { type: string }
        work_id: { type: string, nullable: true }
        kind: { type: string }
        text: { type: string }
        subject: { type: string, nullable: true }
        predicate: { type: string, nullable: true }
        object: { type: string, nullable: true }
        confidence: { type: number }
        review_status: { type: string }
        created_at: { type: string }

    Task:
      type: object
      properties:
        id: { type: string }
        work_id: { type: string, nullable: true }
        text: { type: string }
        status: { type: string }
        priority: { type: integer }
        created_at: { type: string }

    TaskUpdate:
      type: object
      properties:
        status: { type: string, nullable: true }
        text: { type: string, nullable: true }
        priority: { type: integer, nullable: true }

    TaskCreate:
      type: object
      required: [text]
      properties:
        text: { type: string }
        priority: { type: integer, default: 0 }

    Conversation:
      type: object
      properties:
        id: { type: string }
        work_id: { type: string, nullable: true }
        title: { type: string, nullable: true }
        archived: { type: integer }
        model: { type: string, nullable: true }
        last_message: { type: string, nullable: true }
        message_count: { type: integer }
        created_at: { type: string }
        updated_at: { type: string }

    ModelOption:
      type: object
      properties:
        id: { type: string }
        role: { type: string }
        label: { type: string }
        description: { type: string }

    ModelList:
      type: object
      properties:
        models: { type: array, items: { $ref: "#/components/schemas/ModelOption" } }
        default: { type: string }

    ConversationCreate:
      type: object
      properties:
        title: { type: string, nullable: true }
        work_id: { type: string, nullable: true }
        model: { type: string, nullable: true }

    ConversationUpdate:
      type: object
      properties:
        title: { type: string, nullable: true }
        archived: { type: boolean, nullable: true }
        model: { type: string, nullable: true }

    Message:
      type: object
      properties:
        id: { type: string }
        conversation_id: { type: string }
        role: { type: string }
        text: { type: string }
        meta: { type: object }
        created_at: { type: string }

    MessageSend:
      type: object
      required: [text]
      properties:
        text: { type: string }
        stream: { type: boolean, default: false }

    Project:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        work_id: { type: string, nullable: true }
        mastery: { type: number }
        last_review: { type: string, nullable: true }
        created_at: { type: string }

    ProjectCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        work_id: { type: string, nullable: true }

    BackupFile:
      type: object
      properties:
        name: { type: string }
        size_bytes: { type: integer }
        created_at: { type: string }

    Voice:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        engine: { type: string }
        builtin: { type: boolean }

    FileList:
      type: object
      properties:
        files: { type: array, items: { type: object } }
        dirs: { type: array, items: { type: object } }
        path: { type: string }

    UploadRequest:
      type: object
      required: [filename, content_b64]
      properties:
        filename: { type: string }
        content_b64: { type: string }
        subdir: { type: string, default: intake }

    UploadResponse:
      type: object
      properties:
        ok: { type: boolean }
        filename: { type: string }
        path: { type: string }
        size_bytes: { type: integer }

    SystemHealth:
      type: object
      properties:
        status: { type: string }
        services:
          type: object
          properties:
            database: { type: object }
            ai: { type: object }

    Capability:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string }

    Briefing:
      type: object
      properties:
        date: { type: string }
        summary: { $ref: "#/components/schemas/DashboardSummary" }
        greeting: { type: string }

    DuplicatePair:
      type: object
      properties:
        id: { type: string }
        doc_a_id: { type: string }
        doc_b_id: { type: string }
        doc_a_title: { type: string, nullable: true }
        doc_b_title: { type: string, nullable: true }
        similarity: { type: number }
        kind: { type: string, description: "near_duplicate | likely_revision" }
        resolved: { type: integer }
        resolution: { type: string, nullable: true }
        created_at: { type: string }

    Entity:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string }
        canonical: { type: integer }
        aliases: { type: string }
        meta: { type: object }
        created_at: { type: string }
        mention_count: { type: integer }

    EntityDetail:
      allOf:
        - $ref: "#/components/schemas/Entity"
        - type: object
          properties:
            mentions:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  title: { type: string }
                  kind: { type: string }
                  work_id: { type: string, nullable: true }

    GraphNode:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        type: { type: string, description: "entity | document" }
        kind: { type: string, description: "person | place | concept | theme | document | etc." }

    GraphEdge:
      type: object
      properties:
        source: { type: string }
        target: { type: string }
        label: { type: string }
        type: { type: string }

    WorkGraph:
      type: object
      properties:
        work_id: { type: string }
        nodes: { type: array, items: { $ref: "#/components/schemas/GraphNode" } }
        edges: { type: array, items: { $ref: "#/components/schemas/GraphEdge" } }
        node_count: { type: integer }
        edge_count: { type: integer }

    CompletenessDimension:
      type: object
      properties:
        name: { type: string, description: "structural | content | research | editorial | source" }
        label: { type: string }
        score: { type: integer, description: "0-100" }
        current: { type: number }
        target: { type: number }
        unit: { type: string }
        rule: { type: string }
        evidence: { type: array, items: { type: string } }

    CompletenessReport:
      type: object
      properties:
        work_id: { type: string }
        work_title: { type: string }
        overall: { type: integer, description: "Weighted overall score 0-100" }
        readiness: { type: string, description: "Draft | Developing | Substantial | Near-Complete | Ready" }
        summary: { type: string }
        evaluated_at: { type: string }
        dimensions:
          type: array
          items: { $ref: "#/components/schemas/CompletenessDimension" }

    GapItem:
      type: object
      properties:
        kind:        { type: string, description: "undocumented_doc | uncovered_chapter | weak_coverage | missing_sources | orphaned_research | stale_source | duplicate_research | no_structure" }
        title:       { type: string }
        description: { type: string }
        severity:    { type: string, description: "high | medium | low" }
        metadata:    { type: object, additionalProperties: true }

    GapReport:
      type: object
      properties:
        work_id:           { type: string }
        coverage_pct:      { type: integer, description: "0-100 — chapters with sufficient coverage" }
        total_chapters:    { type: integer }
        suggested_queries: { type: array, items: { type: string } }
        evaluated_at:      { type: string }
        gaps:
          type: array
          items: { $ref: "#/components/schemas/GapItem" }

    TopGapItem:
      allOf:
        - $ref: "#/components/schemas/GapItem"
        - type: object
          properties:
            work_id:    { type: string }
            work_title: { type: string }

    TopGapsResponse:
      type: object
      properties:
        gaps:
          type: array
          items: { $ref: "#/components/schemas/TopGapItem" }
        total_works_analyzed: { type: integer }

    OkResponse:
      type: object
      properties:
        ok: { type: boolean }
