                include: { type: array, items: { type: string } }
      responses:
        "200":
          description: Excel generation queued
          content:
            application/json:
              schema: { type: object }

  /generate/report:
    post:
      operationId: generateReport
      summary: Generate a Markdown/HTML report for a Work
      tags: [studio]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                work_id: { type: string }
