[project]
name = "orivellum"
version = "0.1.0"
description = "Orivellum — local-first sovereign AI workspace"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    # Documents
    "python-docx>=1.2.0",
    "docxtpl>=0.20.2",
    "python-redlines>=0.3.0",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "formulas==1.3.4",  # same recalc engine as orivellum-runner — keep in lockstep
    # PDF / OCR
    "pypdf>=6.15.0",
    "pdfplumber>=0.11.10",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
    "pillow>=12.3.0",
    "markitdown>=0.1.7",
    # Math / NLP
    "sympy>=1.14.0",
    # Utilities
    "pyyaml>=6.0.3",
    "psutil>=7.2.2",
    "requests>=2.34.2",
    # Output
    "reportlab>=5.0.0",
    "itsdangerous>=2.2",
    "cryptography>=50.0.0",
    # High-quality local TTS (Kokoro v0.19 via ONNX — human-quality voices, CPU-only)
    "kokoro-onnx>=0.5.0",
    "soundfile>=0.14.0",
    "youtube-transcript-api>=1.2.4",
    "faster-whisper>=1.2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.28.0", "ruff>=0.8.0"]
# Local STT fallback: ~4× faster than vanilla Whisper, MIT license, no server required.
# Install with: pip install faster-whisper   (or uv add faster-whisper)
# Models auto-download on first transcription (~150 MB for "base", ~3 GB for "large-v3").
asr = ["faster-whisper>=1.0"]
# Layout-aware PDF parsing (multi-column reading order, table structure).
# Preferred first extraction tier when installed; every existing tier remains
# as fallback, so this is safe to skip.  Heavy: pulls PyTorch (CPU works);
# layout models auto-download on first conversion (~500 MB).
# Install with: uv sync --extra docling   (or pip install docling)
docling = ["docling>=2.15.0"]

[project.scripts]
orivellum = "orivellum.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orivellum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.importlinter]
root_package = "orivellum"

# Architecture fitness contracts — gated in CI (`lint-imports`).
# Routes call capabilities; capabilities call the database; never the reverse.
[[tool.importlinter.contracts]]
name = "Layered architecture: api -> capabilities -> database"
type = "layers"
layers = ["orivellum.api", "orivellum.capabilities", "orivellum.database"]
# FROZEN BASELINE (2026-08-10): upward imports that existed when the contract
# was adopted. RULE: entries may only be REMOVED, never added — new code must
# respect the layering (pass the executor/notifier in as a parameter instead).
ignore_imports = [
    "orivellum.capabilities.embeddings -> orivellum.api._deps",
    "orivellum.capabilities.enhancement -> orivellum.api.executor",
    "orivellum.capabilities.extraction -> orivellum.api._deps",
    "orivellum.capabilities.folder_watch -> orivellum.api._deps",
    "orivellum.capabilities.folder_watch -> orivellum.api.executor",
    "orivellum.capabilities.intake -> orivellum.api._deps",
    "orivellum.capabilities.knowledge_harvest -> orivellum.api._deps",
    "orivellum.capabilities.mcos -> orivellum.api.routes.conversations",
    "orivellum.capabilities.nightshift -> orivellum.api.executor",
    "orivellum.capabilities.persist -> orivellum.api.executor",
    "orivellum.capabilities.pipeline -> orivellum.api._deps",
    "orivellum.capabilities.pipeline -> orivellum.api.executor",
    "orivellum.capabilities.pipeline -> orivellum.api.notifications",
    "orivellum.capabilities.rerank -> orivellum.api._deps",
    "orivellum.capabilities.websearch -> orivellum.api._deps",
    "orivellum.database.db -> orivellum.capabilities.dedup",
    "orivellum.database.db -> orivellum.capabilities.embeddings",
    "orivellum.database.db -> orivellum.capabilities.state_machine",
    "orivellum.database.mail_store -> orivellum.capabilities.mail.action_policy",
    "orivellum.database.mail_store -> orivellum.capabilities.mail.token_vault",
]

[tool.mutmut]
# Nightly mutation testing (.github/workflows/nightly.yml) — deliberately break
# the forensically critical modules and prove the tests notice. Scope is kept
# small so the nightly run finishes; widen as test speed allows.
source_paths = [
    "src/orivellum/capabilities/state_machine.py",
    "src/orivellum/capabilities/genesis/gates.py",
    "src/orivellum/capabilities/genesis/seal.py",
]
pytest_add_cli_args_test_selection = [
    "tests/test_property_based.py",
    "tests/test_state_machine.py",
    "tests/test_workbench.py",
]
also_copy = ["src/orivellum/", "tests/conftest.py"]
