# ORIVELLUM NEXT — every dial. No thresholds live in code.
# Flat key: value only. Change a value, restart, no deploy.

# ── clarify gate ────────────────────────────────────────────────
max_facets: 3                    # hard ceiling, ranked by what changes the output

# ── next actions ────────────────────────────────────────────────
min_actions: 2
max_actions: 4                   # 3 is the sweet spot; 5+ recreates paralysis
require_anchor_ref: 1            # no suggestion without an evidence pointer
recommend_min_confidence: 0.55   # below this, say "no clear next step"
expire_on_new_answer: 1          # a stale chip must not be tappable

# ── autonomy: the dials that decide when it continues itself ────
auto_run_enabled: 0              # START AT 0. Turn on after a week of watching.
auto_run_max_units: 200          # documents/chapters/files per step
auto_run_max_minutes: 10         # per step
auto_run_requires_reversible: 1  # informational; irreversible NEVER auto-runs
