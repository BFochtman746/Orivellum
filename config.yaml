# Orivellum configuration
# Optimised for: Nimo's Office & Gaming AI PC — AMD Ryzen AI Max+ 395 (Strix Halo)
# LLM backend: Lemonade Server (AMD's official NPU + iGPU inference server)
#
# Hardware summary
#   CPU  : 16 × Zen 5 cores / 32 threads
#   GPU  : 40 RDNA 3.5 Compute Units  ≈ RTX 4070 Laptop  (gfx1150/gfx1151)
#   NPU  : XDNA2, 50 TOPS  ← Lemonade uses this for primary inference
#   RAM  : 128 GB LPDDR5X unified  (≈ 112 GB allocatable to GPU/LLM layers)
#   BW   : ~256 GB/s
#
# Lemonade vs Ollama
#   Lemonade Server is AMD's own inference stack — it schedules automatically
#   across NPU, iGPU, and CPU; you do NOT need HSA_OVERRIDE_GFX_VERSION or
#   OLLAMA_GPU_LAYERS.  Just install Lemonade and it handles acceleration.
#   See: https://lemonade-server.ai  and  scripts/windows/lemonade-setup.md

serving:
  # ── Lemonade Server endpoint ─────────────────────────────────────────────────
  # Lemonade exposes an OpenAI-compatible API on port 8000 (primary) and an
  # Ollama-compatible bridge on port 11434.  Use 8000 for best compatibility.
  # If you see connection errors, try: http://127.0.0.1:11434/v1  (Ollama-compat)
  base_url: "http://127.0.0.1:8000/v1"

  # ── Model selection (A-01 Capability Study — Aug 2026) ───────────────────────
  # Pull models with: lemonade pull <name>
  # Lemonade optimises automatically — NPU for 7-14 B, iGPU for 32-70 B.
  # Use  lemonade list  to see downloaded models;  lemonade models  for all.
  #
  # ── Current loadout (your Ryzen AI Max+ 395, 128 GB) ─────────────────────────
  #  WORKHORSE options:
  #    llama3.3-70b          — 70B iGPU, high single-pass quality, 128K ctx  (current)
  #    Qwen3-30B-A3B         — 30B MoE, only 3B active → ~3× faster, same quality  ★ recommended
  #    Qwen3-32B             — dense 32B, higher ceiling than MoE on hard tasks
  #
  #  REASONER options:
  #    phi4                  — 14B NPU, fast  (current)
  #    gpt-oss-120b          — 120B MXFP4 (~65 GB), best local reasoning  ★ A-01 pick
  #
  #  CODER options:
  #    qwen2.5-coder-32b     — 32B dense coder  (current)
  #    Qwen3-Coder-30B-A3B   — MoE coder, 256K ctx, purpose-built for agents  ★ recommended
  #    Qwen3.6-27B           — 27B dense, ~77% SWE-bench Verified
  #
  # Model names must match exactly what  `lemonade list`  shows after pulling.
  workhorse_model: "llama3.3-70b"
  reasoner_model:  "phi4"
  coder_model:     "qwen2.5-coder-32b"

  # ── Embeddings ────────────────────────────────────────────────────────────────
  # Options ranked by quality (all OpenAI-compatible /v1/embeddings):
  #   Qwen3-Embedding-8B      — SOTA open-source, 70.6 MTEB, ~5 GB Q4  ★ current
  #   nomic-embed-text        — ~0.3 GB, 8K ctx, lightweight CPU fallback
  #   BGE-M3                  — dense + sparse + multi-vector, 100+ langs
  # NOTE: changing embedder requires a full re-index (different vector dims).
  # Pull first:  lemonade pull Qwen3-Embedding-8B
  # Then trigger re-index from System Settings → Semantic Search → Re-index All.
  embedder_model: "Qwen3-Embedding-8B"

  # ── Vision / OCR ──────────────────────────────────────────────────────────────
  # Qwen3-VL-8B: DocVQA ~96 (vs Tesseract ~72), 32-language OCR, GUI grounding.
  # Apache 2.0, ~5 GB Q4.  Dramatically better on scanned / complex documents.
  # To enable: lemonade pull Qwen3-VL-8B  then set: vision_model: "Qwen3-VL-8B"
  vision_model: ""

  # ── TTS / ASR ─────────────────────────────────────────────────────────────────
  # TTS model name for the AI server /v1/audio/speech endpoint.
  # "tts-1-hd" gives higher quality; "tts-1" is faster.
  # Kokoro-82M (local ONNX) is used as fallback when AI server is unavailable.
  tts_model: "tts-1-hd"
  # ASR model for /v1/audio/transcriptions.
  # faster-whisper (CTranslate2) is ~4× faster when self-hosted.
  # Alternatives: "faster-whisper", "whisper-large-v3", "parakeet-tdt-1.1b"
  asr_model: "whisper-1"

  # ── Reranker ──────────────────────────────────────────────────────────────────
  # Leave empty → RRF (reciprocal-rank fusion) only.
  # A reranker typically gives +5–10% RAG precision at low extra latency.
  # Options: "BAAI/bge-reranker-v2-m3" (MIT) or "Qwen3-Reranker-8B" (Apache 2.0)
  reranker_model: ""

  # ── Context window ───────────────────────────────────────────────────────────
  # llama3.3-70b supports 128 K tokens.  The Ryzen AI Max+ 395 iGPU KV-cache
  # lives in unified LPDDR5X — no CPU spill — so the full window is usable.
  # For NPU models (phi4, qwen2.5-7b) Lemonade manages context internally;
  # setting 131072 here ensures Orivellum never prematurely trims prompts for
  # the 70B model.  Reduce to 32768 if you prefer phi4 as the daily driver.
  context_window: 131072

  # ── Timeouts ─────────────────────────────────────────────────────────────────
  # 70 B iGPU at ~25 tok/s: a 2 000-token reply ≈ 80 s.
  # NPU models (phi4, qwen2.5-7b) are much faster — these are safe upper bounds.
  timeout_sec: 300
  extraction_timeout_sec: 120

server:
  port: 8080
  host: "0.0.0.0"
  api_key: ""

# ── Setup notes ──────────────────────────────────────────────────────────────
# Full Lemonade setup guide: scripts/windows/lemonade-setup.md
# After installing Lemonade, pull models then run: .\scripts\start.ps1
