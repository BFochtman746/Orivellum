# Orivellum configuration
# Optimised for: Nimo's Office & Gaming AI PC — AMD Ryzen AI Max+ 395 (Strix Halo)
# LLM backend: Lemonade Server (AMD's official NPU + iGPU inference server)
#
# Hardware summary
#   CPU  : 16 × Zen 5 cores / 32 threads
#   GPU  : 40 RDNA 3.5 Compute Units  ≈ RTX 4070 Laptop  (gfx1150/gfx1151)
#   NPU  : XDNA2, 50 TOPS  ← Lemonade uses this for primary inference
#   RAM  : 128 GB LPDDR5X unified  (≈ 112 GB allocatable to GPU/LLM layers)
#   BW   : ~256 GB/s
#
# Lemonade vs Ollama
#   Lemonade Server is AMD's own inference stack — it schedules automatically
#   across NPU, iGPU, and CPU; you do NOT need HSA_OVERRIDE_GFX_VERSION or
#   OLLAMA_GPU_LAYERS.  Just install Lemonade and it handles acceleration.
#   See: https://lemonade-server.ai  and  scripts/windows/lemonade-setup.md

serving:
  # ── Lemonade Server endpoint ─────────────────────────────────────────────────
  # Lemonade exposes an OpenAI-compatible API on port 13305 (its default) plus
  # an Ollama-compatible bridge on 11434.  The path MUST end /api/v1 (not /v1).
  # Verify the port answers:  curl http://127.0.0.1:13305/api/v1/models
  # (Manual §4.2 step A1 — whichever port answers /api/v1/models goes here.)
  # If you use Ollama instead: http://127.0.0.1:11434/v1
  base_url: "http://127.0.0.1:13305/api/v1"

  # ── Model selection (verified against Lemonade catalog — Aug 2026) ──────────
  # Pull models with: lemonade pull <name>
  # Names must match the Lemonade catalog EXACTLY — they double as API model IDs.
  # Use  lemonade list  to see downloaded models;  lemonade models  for all.
  #
  # Why MoE, not a dense 70B?  This machine's unified memory moves ~256 GB/s.
  # A dense 70B reads all ~40 GB of weights for EVERY token → ~4-5 tok/s.
  # MoE models activate only a few B params per token → 30-70 tok/s at equal
  # or better quality.  (llama3.3-70b is also gone from the Lemonade catalog.)
  #
  #  WORKHORSE options:
  #    Qwen3.6-35B-A3B-GGUF              — MoE 3B active, vision built in, ~23 GB  ★ current
  #    Qwen3-30B-A3B-Instruct-2507-GGUF  — previous-gen MoE, ~17 GB
  #
  #  REASONER options:
  #    gpt-oss-120b-mxfp-GGUF  — 120B MoE, native MXFP4 (~63 GB), best local  ★ current
  #    gpt-oss-20b-mxfp4-GGUF  — smaller sibling (~12 GB) for lighter machines
  #
  #  CODER options:
  #    Qwen3-Coder-30B-A3B-Instruct-GGUF — MoE coder, 256K ctx, agent-tuned  ★ current
  #    Qwen3-Coder-Next-GGUF             — bigger (~48 GB); use when reasoner isn't resident
  workhorse_model: "Qwen3.6-35B-A3B-GGUF"
  reasoner_model:  "gpt-oss-120b-mxfp-GGUF"
  coder_model:     "Qwen3-Coder-30B-A3B-Instruct-GGUF"

  # ── Embeddings ────────────────────────────────────────────────────────────────
  # Options ranked by quality (all OpenAI-compatible /v1/embeddings):
  #   Qwen3-Embedding-8B-GGUF       — SOTA open-source, 70.6 MTEB, ~8 GB Q8  ★ current
  #   nomic-embed-text-v2-moe-GGUF  — ~0.5 GB, lightweight CPU fallback
  # NOTE: changing embedder requires a full re-index (different vector dims).
  # Pull first:  lemonade pull Qwen3-Embedding-8B-GGUF
  # Then trigger re-index from System Settings → Semantic Search → Re-index All.
  embedder_model: "Qwen3-Embedding-8B-GGUF"

  # ── Vision / OCR ──────────────────────────────────────────────────────────────
  # The workhorse (Qwen3.6-35B-A3B) is natively multimodal, so vision reuses it —
  # no extra download, dramatically better than Tesseract on scanned documents.
  # Set to "" to force classic Tesseract-first OCR.
  vision_model: "Qwen3.6-35B-A3B-GGUF"

  # ── TTS / ASR ─────────────────────────────────────────────────────────────────
  # TTS model name for the AI server /v1/audio/speech endpoint.
  # "tts-1-hd" gives higher quality; "tts-1" is faster.
  # Kokoro-82M (local ONNX) is used as fallback when AI server is unavailable.
  tts_model: "kokoro-v1"
  # ASR model for /v1/audio/transcriptions (sent to the AI server).
  # faster-whisper (CTranslate2) is ~4× faster when self-hosted.
  # Alternatives: "faster-whisper", "whisper-large-v3", "parakeet-tdt-1.1b"
  asr_model: "Whisper-Base"
  # Local STT model size (faster-whisper — used when AI server is absent).
  # Options (accuracy ↑ / speed ↓): "tiny", "base", "small", "medium",
  # "large-v3", "large-v3-turbo", "distil-large-v3"
  # "large-v3-turbo" (int8, ~1.6 GB, auto-downloaded) is far more accurate than
  # "base" and Nimo handles it easily. Low-memory machines fall back to "base"
  # automatically, and Settings → System can override this without a restart.
  # Install the package first: uv add faster-whisper
  asr_local_model: "large-v3-turbo"

  # ── Premium TTS ───────────────────────────────────────────────────────────────
  # Best-in-class narration quality for long-form audiobooks.  Blind evaluations
  # (A-01 Aug 2026) show Fish Audio S2 and Hume TADA outperform ElevenLabs and
  # Seed-TTS on prosody consistency and naturalness for > 30-minute narration.
  # Other strong options: Chatterbox (MIT), IndexTTS-2, Qwen3 TTS.
  #
  # Synthesis priority chain when premium is enabled:
  #   (1) Premium engine  →  (2) AI server  →  (3) Kokoro ONNX  →  (4) espeak-ng
  #
  # Setup (bundled Chatterbox sidecar — see sidecars/premium_tts/README.md):
  #   1. Run scripts\start-voice-sidecar.ps1 -Setup   (once)
  #   2. Run scripts\start-voice-sidecar.ps1          (starts 127.0.0.1:9883)
  #   3. Set tts_premium_url: "http://127.0.0.1:9883"
  #   4. Set tts_premium_ack_license: true (Chatterbox is MIT-licensed)
  # Any other engine speaking the same POST /v1/tts contract also works.
  #
  # Leave both at defaults (empty / false) for zero regression.
  tts_premium_url: ""
  # ⚠️  IMPORTANT — review the license for your chosen engine before enabling.
  # Fish Audio S2: https://fish.audio/terms  |  Hume TADA: https://hume.ai/terms
  # Set to true only after confirming license terms for your use case.
  tts_premium_ack_license: false

  # ── Music / SFX generation ────────────────────────────────────────────────────
  # Local music generation sidecar for trailer soundtrack beds and effects
  # (see sidecars/music_gen/README.md).
  #   1. Run scripts\start-music-sidecar.ps1 -Setup   (once)
  #   2. Run scripts\start-music-sidecar.ps1          (starts 127.0.0.1:9884)
  #   3. Set music_gen_url: "http://127.0.0.1:9884"
  # License acknowledgement is per model and collected in the UI:
  #   Stable Audio Open — Stability AI Community License (commercial OK under
  #   $1M annual revenue; weights gated on Hugging Face).
  #   MusicGen — weights CC-BY-NC 4.0 (NON-commercial use only).
  # Leave empty to disable (Generate buttons stay hidden).
  music_gen_url: ""

  # ── Reranker ──────────────────────────────────────────────────────────────────
  # Cross-encoder second-pass scoring for knowledge search, chat context
  # selection, and web-search passages (+5-10% retrieval precision).
  # Pull first:  lemonade pull bge-reranker-v2-m3-GGUF   (~0.6 GB)
  # Safe to leave set even before pulling — a circuit breaker skips it
  # silently when unavailable.  Set to "" to disable entirely, or toggle
  # at runtime from System Settings.
  reranker_model: "bge-reranker-v2-m3-GGUF"

  # ── Context window ───────────────────────────────────────────────────────────
  # All current models support ≥128 K tokens.  The Ryzen AI Max+ 395 iGPU
  # KV-cache lives in unified LPDDR5X — no CPU spill — so the full window is
  # usable.  The coder supports up to 256 K if you ever need more.
  context_window: 131072

  # ── Timeouts ─────────────────────────────────────────────────────────────────
  # MoE models run 30-70 tok/s on this machine — these are safe upper bounds.
  timeout_sec: 300
  extraction_timeout_sec: 120

server:
  port: 8080
  host: "0.0.0.0"
  api_key: ""

# ── Setup notes ──────────────────────────────────────────────────────────────
# Full Lemonade setup guide: scripts/windows/lemonade-setup.md
# After installing Lemonade, pull models then run: .\scripts\start.ps1
